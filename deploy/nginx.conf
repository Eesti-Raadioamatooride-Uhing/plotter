# /etc/nginx/sites-available/plotter
server {
    listen 80;
    server_name plotter.example.org;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name plotter.example.org;

    ssl_certificate     /etc/letsencrypt/live/plotter.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plotter.example.org/privkey.pem;

    # Coverage runs can take a while on a big radius.
    proxy_read_timeout 300s;
    client_max_body_size 4m;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;

    location /static/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_cache_valid 200 1h;
        expires 1h;
    }

    location /api/coverage/ {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        expires 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
