# Local development override: no WAF, app published straight to localhost.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Then open http://127.0.0.1:8088. The port is bound to 127.0.0.1 on purpose,
# so an unfiltered app is never reachable from the network.
services:
  app:
    ports:
      - "127.0.0.1:${PLOTTER_PUBLIC_PORT:-8088}:8000"
    environment:
      PLOTTER_WORKERS: "2"

  waf:
    profiles: ["disabled"]
